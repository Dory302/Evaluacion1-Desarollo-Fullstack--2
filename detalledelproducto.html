<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><title>Detalle de producto | Tienda Mudra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- 1. HEADER PÚBLICO -->
  <header>
    <div class="header-logo">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUClnSJzLBcPckI8kwNNCYgCJlNj1xvrsP6sBdflofMA&s=10" alt="Logo Tienda Mudra" class="img-logo">
      <span>Tienda Mudra</span>
    </div>
    <nav>
      <a href="index.html">Home</a> |
      <a href="productos.html">Productos</a> |
      <a href="nosotros.html">Nosotros</a> |
      <a href="blogs.html">Blogs</a> |
      <a href="contacto.html">Contacto</a>
    </nav>
    <div class="header-acciones">
      <div class="header-cuenta" data-cuenta-header>
        <a class="header-cuenta__inicio" href="iniciosesion.html">Iniciar sesión</a>
        <a class="header-cuenta__crear" href="registrousuario.html">Crear cuenta</a>
      </div>
    <div class="carrito-menu">
      <button class="header-cart carrito-toggle" type="button" aria-expanded="false" aria-controls="carrito-desplegable">
        <span aria-hidden="true">🛒</span>
        Carrito (<span class="cant-carrito" aria-live="polite">0</span>)
      </button>
      <section class="carrito-dropdown" id="carrito-desplegable" hidden role="dialog" aria-modal="false" aria-labelledby="carrito-titulo">
        <div class="carrito-dropdown__encabezado">
          <h2 class="carrito-dropdown__titulo" id="carrito-titulo">Mi carrito</h2>
          <button type="button" class="carrito-dropdown__cerrar" data-cerrar-carrito aria-label="Cerrar carrito">&times;</button>
        </div>
        <div class="carrito-dropdown__items"></div>
        <div class="carrito-dropdown__total">
          <span>Total</span>
          <strong class="carrito-dropdown__total-valor">$0</strong>
        </div>
        <div class="carrito-dropdown__acciones">
          <a class="carrito-dropdown__comprar" href="carrito.html#pagar">Comprar</a>
          <a class="carrito-dropdown__ver" href="carrito.html">Ver carrito</a>
        </div>
      </section>
    </div>
    </div>
  </header>
  <main class="contenedor">
    <h2 id="p-nombre">Cargando...</h2>
    <img id="p-img" src="" width="200"><br>
    <p><strong>Precio:</strong> $<span id="p-precio"></span></p>
    <p id="p-descripcion"></p>
    <p id="p-stock"></p>
    <div class="campo">
      <label>Cantidad:</label>
      <input type="number" id="p-cant" value="1" min="1">
    </div>
    <button id="btn-add" class="boton btn-agregar">Comprar / Añadir</button>
  </main>
  <script src="js/datos.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/carritoylogica.js"></script>
  <script src="js/autenticacion.js"></script>
  <script>
    let params = new URLSearchParams(window.location.search);
    let id = params.get("id") || "URB001";
    function actualizarDetalleProducto() {
      const prod = obtenerProducto(id);
      const boton = document.getElementById("btn-add");
      const cantidad = document.getElementById("p-cant");
      document.getElementById("p-nombre").textContent = prod ? prod.nombre : "Producto no disponible";
      boton.disabled = !prod || prod.stock < 1;
      cantidad.disabled = boton.disabled;
      boton.textContent = boton.disabled ? "No disponible" : "Agregar al carrito";
      if (!prod) {
        document.getElementById("p-img").hidden = true;
        document.getElementById("p-precio").textContent = "—";
        document.getElementById("p-descripcion").textContent = "Este producto ya no está en el catálogo.";
        document.getElementById("p-stock").textContent = "";
        return;
      }
      const imagen = document.getElementById("p-img");
      imagen.hidden = !imagenProductoSegura(prod.img);
      if (!imagen.hidden) imagen.src = imagenProductoSegura(prod.img);
      imagen.alt = prod.nombre;
      document.getElementById("p-precio").textContent = formatearPrecio(prod.precio);
      document.getElementById("p-descripcion").textContent = prod.descripcion || "Sin descripción.";
      document.getElementById("p-stock").textContent = prod.stock + " unidades disponibles";
      cantidad.max = prod.stock;
    }
    actualizarDetalleProducto();
    document.getElementById("btn-add").onclick = function() {
      const cantidad = document.getElementById("p-cant");
      if (cantidad.reportValidity()) agregarAlCarrito(id, Number(cantidad.value));
    };
    window.addEventListener("storage", function(evento) {
      if (evento.key === CLAVE_PRODUCTOS || evento.key === null) actualizarDetalleProducto();
    });
  </script>
  <footer>
  <div class="footer-left">
    <strong>Tienda Mudra</strong>
    <div class="footer-links">
      <a href="productos.html">Polerones</a> |
      <a href="productos.html">Pantalones</a> |
      <a href="productos.html">Accesorios</a>
    </div>
  </div>
  <div class="footer-right">
    <label for="newsletter-detalle-producto">Únete a nuestro Newsletter</label>
    <div class="newsletter-box">
      <input id="newsletter-detalle-producto" type="email" placeholder="Ingresa tu correo">
      <button type="button">Suscribirse</button>
    </div>
  </div>
</footer>
</body>
</html>
